<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar Flexbox</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #2563eb;
      color: white;
      padding: 18px 40px;
    }

    .menu {
      display: flex;
      list-style: none;
      gap: 25px;
    }

    .menu a {
      color: white;
      text-decoration: none;
    }
  </style>
  <body>
    <nav class="navbar">
      <h2>Gamaliel</h2>

      <ul class="menu">
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Proyectos</a></li>
        <li><a href="#">Contacto</a></li>
      </ul>
    </nav>
  </body>
</html>
